name: Django CI - Run Pytest

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production

jobs:
  test:
    name: ✅ Run Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file for testing
        run: |
          cat > .env << EOF
          SECRET_KEY=django-insecure-test-key-for-ci-only
          DEBUG=True
          STAGING_ENV=False
          PRODUCTION_ENV=False
          # Use SQLite for local CI testing
          DATABASE_ENGINE=django.db.backends.sqlite3
          DATABASE_NAME=:memory:
          DATABASE_USER=
          DATABASE_HOST=
          DATABASE_PORT=
          DATABASE_PASSWORD=
          EOF

      - name: Verify Test Database Configuration
        run: |
          export DJANGO_SETTINGS_MODULE=backend.test_settings
          python -c "
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'backend.test_settings')
          import django
          django.setup()
          from django.conf import settings
          print(f'DEBUG = {settings.DEBUG}')
          print(f'Database ENGINE = {settings.DATABASES[\"default\"][\"ENGINE\"]}')
          print(f'Database NAME = {settings.DATABASES[\"default\"][\"NAME\"]}')
          "

      - name: Run Django System Check
        run: |
          export DJANGO_SETTINGS_MODULE=backend.test_settings
          python manage.py check

      - name: Run Tests
        run: |
          export DJANGO_SETTINGS_MODULE=backend.test_settings
          pytest --tb=short --maxfail=3