name: Auto Create Pull Requests

on:
  push:
    branches:
      - '**'  # Run on all branches

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get branch info
        id: info
        run: |
          branch_name="${GITHUB_REF#refs/heads/}"
          commit_message="$(git log -1 --pretty=%B | head -n 1)"
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "commit_message=$commit_message" >> $GITHUB_OUTPUT
          echo "Detected branch: $branch_name"
          echo "Commit message: $commit_message"

      # 🌱 Auto-PR for NEW BRANCHES
      - name: Auto-create PR for new branches
        if: steps.info.outputs.branch_name != 'main' && steps.info.outputs.branch_name != 'prod'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "${{ steps.info.outputs.commit_message }}"
          body: "🔄 Automatically created PR after push to **${{ steps.info.outputs.branch_name }}**."
          base: main
          branch: ${{ steps.info.outputs.branch_name }}
          draft: false

      # 🌀 Auto-PR if push happens on main or prod
      - name: Auto-create PR for main/prod pushes
        if: steps.info.outputs.branch_name == 'main' || steps.info.outputs.branch_name == 'prod'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "${{ steps.info.outputs.commit_message }}"
          body: "⚠️ Direct push detected on **${{ steps.info.outputs.branch_name }}**. This PR mirrors the commit."
          base: ${{ steps.info.outputs.branch_name }}
          branch: ${{ steps.info.outputs.branch_name }}
          draft: false
