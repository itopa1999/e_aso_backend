name: Prevent Direct Push & Auto Create PR

on:
  push:
    branches:
      - main
      - prod

permissions:
  contents: write
  pull-requests: write

jobs:
  protect_main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check if push is to protected branch
        id: check_branch
        run: |
          branch_name=${GITHUB_REF#refs/heads/}
          echo "Branch detected: $branch_name"
          if [[ "$branch_name" == "main" || "$branch_name" == "prod" ]]; then
            echo "is_protected=true" >> $GITHUB_OUTPUT
          else
            echo "is_protected=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-create Pull Request to main
        if: steps.check_branch.outputs.is_protected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🚨 Auto PR: Undo direct push to ${GITHUB_REF_NAME}"
          body: "A direct push was made to **${GITHUB_REF_NAME}**. This PR restores workflow by merging into main for review."
          base: main
          branch: ${{ github.ref_name }}
          draft: true

      - name: Fail the workflow (prevent direct push)
        if: steps.check_branch.outputs.is_protected == 'true'
        run: |
          echo "❌ Direct pushes to main or prod are not allowed. A PR has been opened instead."
          exit 1
